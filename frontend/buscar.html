<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboxd — Buscar</title>
  <link rel="stylesheet" href="buscar.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">Soundboxd</div>
    <nav>
      <a href="index.html">Início</a>
      <a href="home.html">Home</a>
      <a href="lists.html">Listas</a>
      <a href="perfil.html">Perfil</a>
    </nav>
  </header>

  <main>
    <section class="search-header">
      <h1>Buscar</h1>
      <form class="search-form">
        <input type="text" class="search-input" placeholder="Buscar álbuns, artistas...">
        <button type="submit" class="search-btn">Buscar</button>
      </form>
    </section>

    <section class="search-results">
      <h2>Resultados para "Frank Ocean"</h2>
      <div class="album-grid">
        <div class="album-card">
          <img src="https://placehold.co/200x200" alt="Capa do álbum">
          <p class="album-title">Blonde</p>
          <p class="album-artist">Frank Ocean</p>
        </div>
        <div class="album-card">
          <img src="https://placehold.co/200x200" alt="Capa do álbum">
          <p class="album-title">Channel Orange</p>
          <p class="album-artist">Frank Ocean</p>
        </div>
        <div class="album-card">
          <img src="https://placehold.co/200x200" alt="Capa do álbum">
          <p class="album-title">Nostalgia, Ultra</p>
          <p class="album-artist">Frank Ocean</p>
        </div>
        <div class="album-card">
          <img src="https://placehold.co/200x200" alt="Capa do álbum">
          <p class="album-title">Endless</p>
          <p class="album-artist">Frank Ocean</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Soundboxd — projeto pessoal</p>
  </footer>

</body>
</html>
