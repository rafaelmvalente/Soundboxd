<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboxd — Criar conta</title>
  <link rel="stylesheet" href="create-account.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">Soundboxd</div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Crie sua conta</h1>
      <p class="auth-subtitle">Comece a registrar o que você ouve.</p>

      <form class="auth-form">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" name="username" placeholder="seu_usuario" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <label for="confirm-password">Confirmar senha</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>

        <button type="submit" class="auth-btn">Criar conta</button>
      </form>

      <p class="auth-footer-text">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

</body>
</html>
