<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboxd — Listas</title>
  <link rel="stylesheet" href="css/lists.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">Soundboxd</div>
    <nav>
      <a href="index.html">Início</a>
      <a href="home.html">Home</a>
      <a href="buscar.html">Buscar</a>
      <a href="perfil.html">Perfil</a>
    </nav>
  </header>

  <main>
    <section class="lists-header">
      <h1>Suas listas</h1>
      <button class="new-list-btn" id="new-list-btn" type="button">+ Nova lista</button>
    </section>

    <section class="lists-section" id="lists-container" aria-live="polite"></section>
  </main>

  <div class="modal-overlay" id="new-list-modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="new-list-title">
      <button class="modal-close" id="new-list-close" type="button" aria-label="Fechar">×</button>
      <h2 id="new-list-title">Criar lista</h2>
      <form id="new-list-form">
        <label for="new-list-title-input">Nome da lista</label>
        <input id="new-list-title-input" name="name" maxlength="60" required>
        <button class="new-list-btn" type="submit">Criar lista</button>
      </form>
    </div>
  </div>

  <footer>
    <p>Soundboxd — projeto pessoal</p>
  </footer>

  <script src="JS/script.js" defer></script>
</body>
</html>
