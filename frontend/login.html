<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboxd — Entrar</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">Soundboxd</div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Entrar</h1>
      <p class="auth-subtitle">Bem-vindo</p>

      <form class="auth-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com" required>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit" class="auth-btn">Entrar</button>
      </form>

      <p class="auth-footer-text">Ainda não tem uma conta? <a href="create-account.html">Criar conta</a></p>
    </div>
  </main>

</body>
</html>
