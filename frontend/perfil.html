<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboxd — Perfil</title>
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">Soundboxd</div>
    <nav>
      <a href="index.html">Início</a>
      <a href="home.html">Home</a>
      <a href="buscar.html">Buscar</a>
      <a href="lists.html">Listas</a>
    </nav>
  </header>

  <main>
    <section class="profile-header">
      <img src="https://placehold.co/120x120" alt="Foto de perfil" class="avatar">
      <div class="profile-info">
        <h1 id="profile-name">Rafael</h1>
        <p class="profile-bio">Estudante de Engenharia de Software · apaixonado por música</p>
        <div class="profile-stats">
          <div class="stat">
            <span class="stat-number" id="profile-listened-count">0</span>
            <span class="stat-label">álbuns ouvidos</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="profile-review-count">0</span>
            <span class="stat-label">reviews</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="profile-list-count">0</span>
            <span class="stat-label">listas</span>
          </div>
          <div class="stat">
            <span class="stat-number">12</span>
            <span class="stat-label">seguidores</span>
          </div>
        </div>
      </div>
    </section>

    <section class="album-grid-section">
      <h2>Álbuns avaliados</h2>
      <div class="album-grid" id="profile-albums"></div>
    </section>

    <section class="review-section">
      <h2>Últimas reviews</h2>
      <div id="profile-reviews"></div>
    </section>
  </main>

  <footer>
    <p>Soundboxd — projeto pessoal</p>
  </footer>

  <script src="JS/script.js" defer></script>
</body>
</html>
